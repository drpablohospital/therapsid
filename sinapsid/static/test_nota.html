<!DOCTYPE html>
<html>
<head>
    <title>Test - Generar Nota</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: #e0e0e0;">
    <h1>🧪 TEST - Generador de Notas</h1>
    
    <div style="margin: 20px 0;">
        <label>FC: </label>
        <input type="text" id="evoFc" value="80" style="background: #333; color: white; border: 1px solid #555; padding: 5px;">
    </div>
    
    <div style="margin: 20px 0;">
        <label>TAS: </label>
        <input type="text" id="evoTas" value="120" style="background: #333; color: white; border: 1px solid #555; padding: 5px;">
    </div>
    
    <div style="margin: 20px 0;">
        <label>TAD: </label>
        <input type="text" id="evoTad" value="80" style="background: #333; color: white; border: 1px solid #555; padding: 5px;">
    </div>
    
    <button onclick="generarTest()" style="padding: 15px 30px; font-size: 1.2rem; background: #ff6b35; color: white; border: none; border-radius: 8px; cursor: pointer;">
        🚀 GENERAR NOTA (TEST)
    </button>
    
    <div id="resultado" style="margin-top: 20px; padding: 20px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; display: none;">
        <h3>Resultado:</h3>
        <pre id="textoResultado" style="white-space: pre-wrap; font-family: monospace; font-size: 1rem;"></pre>
    </div>
    
    <script>
        function generarTest() {
            const fc = document.getElementById('evoFc').value;
            const tas = document.getElementById('evoTas').value;
            const tad = document.getElementById('evoTad').value;
            
            const tam = ((parseFloat(tas) - parseFloat(tad)) / 3) + parseFloat(tad);
            
            const nota = `
═══════════════════════════════════════════════
NOTA DE EVOLUCIÓN - TEST SIMPLIFICADO
═══════════════════════════════════════════════

Fecha: ${new Date().toLocaleDateString('es-MX')}
Hora: ${new Date().toLocaleTimeString('es-MX')}

SIGNOS VITALES:
  FC: ${fc} lpm
  TAS: ${tas} mmHg
  TAD: ${tad} mmHg
  TAM: ${tam.toFixed(1)} mmHg

NOTA:
Paciente estable, sin alteraciones significativas.

═══════════════════════════════════════════════
Generado por Sinapsid
═══════════════════════════════════════════════
            `;
            
            document.getElementById('textoResultado').textContent = nota;
            document.getElementById('resultado').style.display = 'block';
            
            console.log('✅ Nota generada exitosamente');
            alert('✅ Nota generada! Mira abajo el resultado.');
        }
    </script>
</body>
</html>
